[package]
name = "tree-sitter-gomod"
version = "1.0.1"
edition = "2021"
license = "MIT"
# Patched: modernized bindings (LanguageFn / LANGUAGE const for tree-sitter 0.25 —
# upstream 1.0.1 binds an old tree-sitter and split the dependency graph) and
# parser.c pre-compiled to lib/libtree_sitter_gomod.a for wasm32-wasip2 (zig cc,
# docs/WASM_BUILD_PATCHES.md). Native builds still compile the C source directly.
build = "build.rs"
autolib = false

[lib]
name = "tree_sitter_gomod"
path = "bindings/rust/lib.rs"

[dependencies.tree-sitter-language]
version = "0.1"

[build-dependencies]
cc = "1"
